<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' blob:">
  <title>Jwellers Edith</title>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('app_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>

  <!-- Discreet Security Key Lock Curtain (Zero-Trace / Instant Pull-to-Lock) -->
  <div id="vault-lock-curtain" class="vault-curtain-overlay" style="display:none;">
    <div class="vault-curtain-card">
      <button id="curtain-theme-toggle" class="btn btn-sm btn-outline" style="position:absolute;top:16px;right:16px;font-weight:600;padding:4px 10px;font-size:12px;cursor:pointer;" title="Toggle Light / Dark Mode">
        <span id="curtain-theme-icon">🌙</span> <span id="curtain-theme-label">Dark</span>
      </button>
      <div class="auth-brand-icon" style="width:64px;height:64px;margin:0 auto 16px;font-size:28px;border-radius:16px;">JE</div>
      <h2 class="vault-curtain-title">Jwellers Edith</h2>
      <p class="vault-curtain-desc" style="font-size:14px;color:var(--text-secondary);margin-bottom:14px;">
        Security Key Authentication Required
      </p>

      <div class="vault-curtain-pulse">
        <span class="vault-dot-pulse"></span>
        <span>Waiting for authorized security drive...</span>
      </div>

      <div class="vault-curtain-prompt">
        Please insert your authorized security drive / USB key to unlock.
      </div>

      <div class="vault-curtain-actions">
        <button class="btn btn-primary" id="curtain-btn-virtual-test" style="font-weight:700;display:flex;align-items:center;gap:6px;">
          ⚡ Quick Test (Virtual Vault)
        </button>
        <button class="btn btn-outline" id="curtain-btn-scan">🔄 Rescan</button>
        <button class="btn btn-outline" id="curtain-btn-toggle-pair" style="border-color:var(--primary);color:var(--primary);">
          🔑 Register Key ▼
        </button>
      </div>

      <!-- Quick Register Drawer -->
      <div id="curtain-pair-drawer" style="display:none;margin-top:20px;padding:16px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;text-align:left;">
        <div style="font-size:13px;font-weight:700;color:var(--primary);margin-bottom:6px;">Register Security Drive</div>
        <div style="font-size:11px;color:var(--text-secondary);margin-bottom:12px;">Configure an authorized removable drive for application access.</div>
        <div style="display:flex;gap:8px;margin-bottom:6px;">
          <select id="curtain-select-drive" style="flex:1;background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;">
            <option value="">Choose Removable Drive...</option>
          </select>
          <button class="btn btn-primary" id="curtain-btn-init-confirm" style="font-size:12px;font-weight:700;padding:6px 14px;">
            Register
          </button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/dashboard.js"></script>
  <script src="js/screens/customer.js"></script>
  <script src="js/screens/staff.js"></script>
  <script src="js/screens/permissions.js"></script>
  <script src="js/screens/shopSetup.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/screens/product.js"></script>
  <script src="js/utils/toast.js"></script>
  <script src="js/screens/khata.js"></script>
  <script src="js/screens/girvi.js"></script>
  <script src="js/screens/billing.js"></script>
  <script src="js/screens/reports.js"></script>
  <script src="js/screens/backup.js"></script>
  <script src="js/screens/activity.js"></script>
  <script src="js/screens/vault.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
